name: sync-dev

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip push)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/storytold/photocraft.git
          else
            git remote add upstream https://github.com/storytold/photocraft.git
          fi
          git fetch upstream main
          git fetch origin

      - name: Re-apply patch merges
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          git checkout dev
          git fetch upstream main
          git fetch origin
          git checkout -B dev upstream/main
          for patch in "fix/x11-desktop-dpi"; do
            if git rev-parse --verify "origin/${patch}" >/dev/null 2>&1; then
              git merge --no-edit "origin/${patch}"
            else
              echo "SKIP missing origin/${patch}"
            fi
          done
          git diff --check
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            echo "DRY-RUN: skipping push"
            git status --short --branch
          fi

      - name: Push dev
        if: ${{ inputs.dry_run != true }}
        run: git push origin dev
